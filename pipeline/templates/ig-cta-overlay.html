<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=__H__">
<title>ig-cta-overlay</title>
<script src="gsap.min.js"></script>
<!-- 인스타 판 하단 스티커 — 「댓글에 <키워드> 남기시면 DM으로 보내 드립니다」 (video SKILL 「인스타 CTA 판」 2026-10-20 · YBMECC 2026-10-21 이식).
     ig-cta.mjs 가 이 파일을 output/ig-cta/hf/index.html 로 복사하며 띠 높이·길이·글꼴 선언·설정(밑줄 두 겹 자리표시)을 채우고 본편 길이 그대로
     1080×띠 높이 하나를 투명 MOV 로 한 번 굽는다 — 본편 위에 ffmpeg overlay 한 번으로 얹는다(재렌더·길이 변화 없음).
     글자는 항상 그대로 읽히게 두고 움직임은 아이콘에만 준다 — 말풍선 점 세 개(누가 댓글을 쓰는 중) → 키워드 칩 눌림
     → 봉투가 오른쪽 DM 칸으로 날아감 → DM 칸이 튀고 배지 「1」. 인스타 UI 복제 금지: 하트·종이비행기·인스타 로고 없음.
     글은 ABM 한국어 판(댓글에 · 키워드 칩 · 보상), 아이콘은 ABMEN 말풍선·봉투(ABM 우편엽서는 그 채널 컨셉이라 가져오지 않았다).
     팔레트는 brand.json(채널05 §2) — 버건디 알약·Ivory 글자·Gold 키워드 칩(Ink 글자)·오렌지 배지(Ink 글자). 서체 Pretendard 한 가지. -->
<style>
__FONTFACE__
  *{box-sizing:border-box}
  html,body{margin:0;width:1080px;height:__H__px;overflow:hidden;background:transparent}
  #root{position:relative;width:1080px;height:__H__px;overflow:hidden;font-family:Brand,sans-serif}
  #st{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:var(--h);transform-origin:50% 100%}
  #pill{position:absolute;inset:0;border-radius:999px;background:var(--pill);box-shadow:0 0 0 3px var(--paper),0 10px 26px rgba(43,20,32,.42)}
  .ic{position:absolute;top:calc((var(--h) - var(--ic)) / 2);width:var(--ic);height:var(--ic);border-radius:50%}
  #bub{left:calc((var(--h) - var(--ic)) / 2);background:var(--gold)}
  #box{right:calc((var(--h) - var(--ic)) / 2);background:var(--paper)}
  .ic svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #txt{position:absolute;left:var(--h);right:var(--h);top:0;height:var(--h);display:flex;align-items:center;justify-content:center;gap:.28em;
       white-space:nowrap;font-size:var(--fs);font-weight:700;letter-spacing:-.01em;color:var(--paper);font-synthesis:none}
  #kw{position:relative;display:inline-block;padding:.08em .32em .1em;border-radius:.26em;background:var(--gold);color:var(--ink);font-weight:850;font-size:1.04em;letter-spacing:0;transform-origin:50% 55%}
  #rw{font-size:.97em;font-weight:600}
  #ring{position:absolute;inset:-7px;border-radius:.36em;border:5px solid var(--gold);opacity:0;pointer-events:none}
  #badge{position:absolute;right:calc((var(--h) - var(--ic)) / 2 - 8px);top:calc((var(--h) - var(--ic)) / 2 - 10px);width:38px;height:38px;border-radius:50%;
         background:var(--warm);color:var(--ink);font-weight:850;font-size:24px;line-height:38px;text-align:center;box-shadow:0 0 0 3px var(--pill);transform:scale(0)}
  #tok{position:absolute;left:0;top:0;width:44px;height:32px;opacity:0;filter:drop-shadow(0 3px 3px rgba(43,20,32,.4))}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="1080" data-height="__H__">
  <div id="st">
    <div id="pill"></div>
    <div class="ic" id="bub"><svg viewBox="0 0 100 100">
      <path d="M22 30 Q22 20 32 20 H68 Q78 20 78 30 V58 Q78 68 68 68 H46 L32 80 V68 H32 Q22 68 22 58 Z" fill="var(--paper)"/>
      <circle id="d1" cx="38" cy="44" r="5.5" fill="var(--pill)"/><circle id="d2" cx="50" cy="44" r="5.5" fill="var(--pill)"/><circle id="d3" cx="62" cy="44" r="5.5" fill="var(--pill)"/>
    </svg></div>
    <div id="txt"><span id="ld"></span><span id="kw"><span id="kwt"></span><i id="ring"></i></span><span id="rw"></span></div>
    <div class="ic" id="box"><svg viewBox="0 0 100 100">
      <rect x="24" y="31" width="52" height="38" rx="6" fill="var(--ink)"/>
      <path d="M26 34 L50 53 L74 34" fill="none" stroke="var(--paper)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg></div>
    <div id="badge">1</div>
    <svg id="tok" viewBox="0 0 44 32"><rect x="2" y="2" width="40" height="28" rx="5" fill="var(--gold)" stroke="var(--paper)" stroke-width="3"/>
      <path d="M5 6 L22 19 L39 6" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </div>
</div>
<script>
(function(){
  const C = __CFG__;
  const R = document.documentElement.style;
  for (const [k, v] of Object.entries(C.colors)) R.setProperty('--' + k, v);
  Object.entries({x: C.x + 'px', y: C.y + 'px', w: C.w + 'px', h: C.h + 'px', ic: C.ic + 'px', fs: C.fs + 'px'}).forEach(([k, v]) => R.setProperty('--' + k, v));
  document.getElementById('ld').textContent = C.lead;
  document.getElementById('kwt').textContent = C.keyword;
  document.getElementById('rw').textContent = C.reward;

  // 봉투 비행은 고정 좌표다 — 두 아이콘은 알약 양 끝 고정 자리(글자 길이와 무관), 고리는 칩의 자식이라 칩을 따라간다
  const pad = (C.h - C.ic) / 2, from = {x: pad + C.ic / 2 - 22, y: C.h / 2 - 16}, to = {x: C.w - pad - C.ic / 2 - 22, y: C.h / 2 - 16};
  const tl = gsap.timeline({paused: true});
  gsap.set('#tok', {x: from.x, y: from.y, opacity: 0, scale: .6});
  gsap.set('#st', {opacity: 0});

  // 등장 한 번(C.start 초): 아래에서 솟아 살짝 튄다 — 0초 포스터·첫 3초 훅은 비워 둔다
  tl.fromTo('#st', {y: 46, scale: .82, opacity: 0}, {y: 0, scale: 1, opacity: 1, duration: .42, ease: 'back.out(2.2)', immediateRender: false}, C.start);
  tl.fromTo('#kw', {scale: .6}, {scale: 1, duration: .3, ease: 'back.out(3)', immediateRender: false}, C.start + .22);

  // 한 주기(C.cycle 초) — 움직임 약 1.4초, 나머지는 정지. 주기 끝 상태 = 시작 상태. 시각의 순수 함수라 어느 프레임으로 찾아가도 같다
  const cycle = (t) => {
    ['#d1', '#d2', '#d3'].forEach((d, i) => {
      tl.to(d, {attr: {cy: 37}, duration: .14, ease: 'power2.out'}, t + .05 + i * .1);
      tl.to(d, {attr: {cy: 44}, duration: .16, ease: 'power2.in'}, t + .19 + i * .1);
    });
    tl.to('#bub', {scale: 1.12, duration: .12, ease: 'power2.out'}, t + .42);
    tl.to('#bub', {scale: 1, duration: .2, ease: 'back.out(3)'}, t + .54);
    // 키워드 칩 눌림 + 고리 파문
    tl.to('#kw', {scale: .88, duration: .07, ease: 'power2.in'}, t + .5);
    tl.to('#kw', {scale: 1.1, duration: .12, ease: 'back.out(3)'}, t + .57);
    tl.to('#kw', {scale: 1, duration: .14, ease: 'power2.out'}, t + .69);
    tl.fromTo('#ring', {opacity: .95, scale: 1}, {opacity: 0, scale: 1.28, duration: .42, ease: 'power2.out', immediateRender: false}, t + .57);
    // 봉투가 말풍선에서 DM 칸으로 — x 는 고르게, y 는 알약 위로 솟았다 내려온다(두 트윈으로 포물선)
    tl.set('#tok', {opacity: 1}, t + .62);
    tl.to('#tok', {scale: 1, duration: .14, ease: 'back.out(3)'}, t + .62);
    tl.to('#tok', {x: to.x, duration: .5, ease: 'power1.inOut'}, t + .64);
    tl.to('#tok', {y: -C.arc, rotation: -10, duration: .25, ease: 'power2.out'}, t + .64);   // 꼭짓점은 알약 윗변 위 — 글자를 가리지 않는다
    tl.to('#tok', {y: to.y, rotation: 0, duration: .25, ease: 'power2.in'}, t + .89);
    tl.to('#tok', {scale: .5, opacity: 0, duration: .08, ease: 'power1.in'}, t + 1.1);
    // DM 칸이 받고 튀며 배지 「1」, 주기 끝에서 걷는다
    tl.to('#box', {scale: 1.16, duration: .1, ease: 'power2.out'}, t + 1.12);
    tl.to('#box', {scale: 1, duration: .26, ease: 'back.out(3)'}, t + 1.22);
    tl.to('#badge', {scale: 1, duration: .24, ease: 'back.out(3.4)'}, t + 1.16);
    tl.to('#badge', {scale: 0, duration: .16, ease: 'power2.in'}, t + C.cycle - .32);
    tl.set('#tok', {x: from.x, y: from.y, scale: .6, opacity: 0}, t + C.cycle - .1);
  };
  // 영상 끝에서 잘리는 주기는 넣지 않는다 — 배지가 뜬 채 끝나거나 봉투가 공중에서 끝나지 않게
  for (let t = C.start + .5; t + C.cycle <= C.dur + .001; t += C.cycle) cycle(t);
  tl.set({}, {}, C.dur);   // 타임라인 길이 = data-duration = 본편 길이
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
})();
</script>
</body>
</html>
